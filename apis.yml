    name: Microsoft Defender for Cloud REST API
    description: >-
      Azure Resource Manager REST API for managing Defender for Cloud
      assessments, alerts, recommendations, secure score, regulatory compliance,
      pricing/plans, security contacts, and connectors for multi-cloud
      environments. Authentication is via Azure AD OAuth 2.0 bearer tokens
      against the management.azure.com endpoint with api-version query
      parameters.
