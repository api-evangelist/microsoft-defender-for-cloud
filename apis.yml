aid: microsoft-defender-for-cloud
name: Microsoft Defender for Cloud
description: >-
  Microsoft Defender for Cloud is Microsoft's unified cloud-native application
  protection platform (CNAPP) that delivers cloud security posture management
  (CSPM) and cloud workload protection (CWPP) across Azure, AWS, GCP, and
  hybrid/on-premises workloads. It provides security recommendations, secure
  score, regulatory compliance assessments, vulnerability management, and
  advanced threat protection for servers, containers, databases, storage, and
  more. The Defender for Cloud REST APIs are part of the Azure Resource
  Manager surface and authenticate via Azure Active Directory OAuth 2.0 tokens.
